services:
  - type: web
    name: atc-planner
    env: docker
    dockerfilePath: ./Dockerfile
    repo: https://github.com/votre-username/atc-planner
    branch: main
    plan: free
    
    # Variables d'environnement
    envVars:
      - key: ADMIN_RESET_KEY
        value: adm1n_k3y_2026_s3cur3!
      - key: DEFAULT_PASSWORD
        value: ATC2026
      - key: STREAMLIT_SERVER_PORT
        value: 10000
    
    # Stockage persistant
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
    
    # Health check
    healthCheckPath: /_stcore/health
    
    # Ports
    ports:
      - port: 10000
        protocol: http